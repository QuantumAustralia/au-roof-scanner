# Public HTTPS entry for the Lightsail IP.
# Port 443 serves the scanner dashboard and the marketplace.
# /review/ is the address-review page.

server {
    listen 80;
    listen [::]:80;
    server_name 52.62.236.191;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 52.62.236.191;

    ssl_certificate /etc/letsencrypt/live/52.62.236.191/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52.62.236.191/privkey.pem;

    client_max_body_size 20m;

    location /review/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /review;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · QMS Roof Scan</title>
  <style>
    :root { color-scheme: light; --navy: #1b2838; --ink: #1c2430; --muted: #5c6b7a; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: "Segoe UI", sans-serif; color: var(--ink); background: #f4f6f8; }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 16px 20px; background: #010F34; color: white; }
    header a { color: white; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo { height: 64px; width: auto; border-radius: 8px; }
    h1 { margin: 0; font-size: 22px; }
    main { max-width: 820px; margin: 0 auto; padding: 28px 20px 40px; }
    h2 { font-size: 18px; margin-top: 28px; }
    p, li { line-height: 1.5; }
    .site-footer { margin-top: auto; padding: 12px 16px; background: #010F34; color: #d5dee8; font-size: 11px; line-height: 1.45; text-align: center; }
    .site-footer a { color: #ffffff; }
    .site-footer nav { display: flex; gap: 14px; justify-content: center; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="{{ url_for('static', filename='qms-roof-scan.jpg') }}" alt="QMS Roof Scan">
      <h1>{{ title }}</h1>
    </div>
    <a href="{{ url_for('marketplace_home') }}">Marketplace</a>
  </header>
  <main>
    {{ body|safe }}
  </main>
  {% include "_footer.html" %}
</body>
</html>
